services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    ports:
      - "9092:9092"
    tmpfs:
      - /var/lib/kafka/data:uid=1000,gid=1000,mode=0755   # ephemeral demo data
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.7.1
    container_name: control-center
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

  # Services run on the host with `mvn spring-boot:run` or via the "apps" profile.
  order-service:
    profiles: ["apps"]
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: order-service } }
    depends_on: { kafka: { condition: service_healthy } }
    environment: { KAFKA_BOOTSTRAP_SERVERS: "kafka:29092" }
    ports: ["8080:8080"]
  payment-service:
    profiles: ["apps"]
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: payment-service } }
    depends_on: { kafka: { condition: service_healthy } }
    environment: { KAFKA_BOOTSTRAP_SERVERS: "kafka:29092" }
  inventory-service:
    profiles: ["apps"]
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: inventory-service } }
    depends_on: { kafka: { condition: service_healthy } }
    environment: { KAFKA_BOOTSTRAP_SERVERS: "kafka:29092" }
  notification-service:
    profiles: ["apps"]
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: notification-service } }
    depends_on: { kafka: { condition: service_healthy } }
    environment: { KAFKA_BOOTSTRAP_SERVERS: "kafka:29092" }
